[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fbb"
version = "1.0.0"
description = "Fantasy basketball tools for the Chantasy Yahoo league: waiver optimizer, roster decisions, Putilla awards"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "yahoo_fantasy_api>=2.7",
    "yahoo_oauth>=2.0",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "Flask>=3.1",
    "Flask-HTTPAuth>=4.8",
    "gunicorn>=22",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fbb = "fbb.cli:main"

[tool.setuptools.packages.find]
include = ["fbb*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
